<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Administración | EnObra</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<style>
@font-face{font-family:Outfit;src:url(assets/outfit-600.ttf);font-weight:600}
@font-face{font-family:Outfit;src:url(assets/outfit-700.ttf);font-weight:700}
@font-face{font-family:Inter;src:url(assets/inter-400.ttf);font-weight:400}
@font-face{font-family:Inter;src:url(assets/inter-500.ttf);font-weight:500}
@font-face{font-family:Inter;src:url(assets/inter-700.ttf);font-weight:700}
:root{--navy:#12233f;--blue:#304e7d;--orange:#ff6a1f;--ot:#b94308;--light:#f3f6fa;--line:#dfe5ec;--gray:#626b79;--green:#1f7a4d;--gbg:#e6f4ec;--red:#b03030;--rbg:#fdeaea;--ybg:#fff1e5;--sw:240px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Inter,Arial,sans-serif;color:var(--navy);background:var(--light);min-height:100vh;font-size:15px}
h1,h2,h3{font-family:Outfit,Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
/* login */
#login{position:fixed;inset:0;background:linear-gradient(135deg,var(--blue),var(--navy));display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
.login-card{background:#fff;border-radius:18px;padding:40px 36px;width:100%;max-width:420px;box-shadow:0 30px 80px #0006;text-align:center}
.login-card h1{font-size:1.7rem}.login-card h1 span,.brand span{color:var(--orange)}
.login-card p{color:var(--gray);margin:8px 0 22px;font-size:.9rem}
.profile{display:flex;align-items:center;gap:14px;width:100%;padding:14px;margin-top:10px;background:var(--light);border:2px solid var(--line);border-radius:12px;text-align:left;transition:.15s}
.profile:hover{border-color:var(--orange);background:#fff}
.profile b{display:block}.profile small{color:var(--gray)}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--orange);color:#fff;display:grid;place-items:center;font:700 1rem Outfit;flex-shrink:0}
.warn{margin-top:20px;font-size:.75rem;color:var(--gray);background:var(--light);border-radius:8px;padding:10px;line-height:1.5}
/* layout */
#app{display:flex}
.sidebar{width:var(--sw);position:fixed;inset:0 auto 0 0;background:linear-gradient(180deg,var(--navy),var(--blue));color:#fff;display:flex;flex-direction:column;z-index:30;transition:transform .25s}
.brand{padding:22px 20px;border-bottom:1px solid #fff2;font:700 1.5rem Outfit}
.brand small{display:block;font:500 .65rem Inter;letter-spacing:1.5px;color:#fff9;margin-top:2px}
.tag{display:inline-block;background:var(--orange);font:700 .6rem Inter;padding:2px 8px;border-radius:10px;margin-top:8px;letter-spacing:.5px}
nav{flex:1;padding:12px 0;overflow-y:auto}
.lbl{font-size:.62rem;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:#fff6;padding:12px 20px 4px}
.nav{display:flex;align-items:center;gap:10px;width:100%;padding:11px 20px;background:none;border:0;border-left:3px solid transparent;color:#ffffffb8;text-align:left;text-decoration:none;font-size:.9rem}
.nav:hover{background:#fff1;color:#fff}
.nav.on{background:#fff2;color:#fff;border-left-color:var(--orange);font-weight:500}
.nav i{font-style:normal;width:20px;text-align:center}
.nav em{margin-left:auto;font-style:normal;background:#fff2;border-radius:10px;padding:0 8px;font-size:.72rem}
.side-foot{display:flex;align-items:center;gap:10px;padding:16px 20px;border-top:1px solid #fff2}
.side-foot div{flex:1;min-width:0;font-size:.8rem}.side-foot small{display:block;color:#fff8}
.side-foot button{background:none;border:0;color:#fffa;font-size:1rem}
main{margin-left:var(--sw);flex:1;min-width:0;min-height:100vh}
.top{position:sticky;top:0;z-index:20;background:#fff;height:64px;padding:0 28px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line)}
.top h2{font-size:1.35rem;flex:1}
.menu-btn{display:none;background:none;border:0;font-size:1.5rem}
.content{padding:26px 28px 50px;max-width:1100px}
/* buttons */
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--orange);color:#fff;border:0;padding:9px 18px;border-radius:8px;font-weight:500;font-size:.87rem;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--ot)}
.btn.ghost{background:#fff;color:var(--navy);border:1.5px solid var(--line)}
.btn.ghost:hover{border-color:var(--orange);color:var(--ot)}
.btn.danger{background:var(--red)}
.ib{background:#fff;border:1.5px solid var(--line);border-radius:8px;padding:6px 10px;font-size:.8rem}
.ib:hover{border-color:var(--orange);color:var(--ot)}.ib.del:hover{border-color:var(--red);color:var(--red);background:var(--rbg)}
/* cards */
.intro{color:var(--gray);margin-bottom:20px;line-height:1.5}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
.stat{background:#fff;border-radius:12px;padding:18px;border-left:4px solid var(--blue);box-shadow:0 3px 14px #12233f0d;text-align:left;border-top:0;border-right:0;border-bottom:0}
.stat.o{border-left-color:var(--orange)}
.stat span{font-size:1.4rem}.stat b{display:block;font:700 2rem Outfit;line-height:1.1;margin-top:6px}.stat small{color:var(--gray)}
.box{background:#fff;border-radius:12px;box-shadow:0 3px 14px #12233f0d;overflow:hidden;margin-bottom:20px}
.box-h{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.box-h h3{flex:1;font-size:1.15rem}
.box-b{padding:20px}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;list-style:none}
.steps li{background:var(--light);border-radius:10px;padding:16px;font-size:.88rem;line-height:1.5}
.steps b{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--orange);color:#fff;margin-bottom:8px}
.quick{display:flex;gap:10px;flex-wrap:wrap}
input.search{border:1.5px solid var(--line);border-radius:8px;padding:8px 12px;background:var(--light);width:210px;font-size:.85rem}
/* table */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{padding:10px 16px;text-align:left;font-size:.68rem;letter-spacing:.8px;text-transform:uppercase;color:var(--gray);background:var(--light)}
td{padding:12px 16px;border-top:1px solid var(--line);font-size:.87rem;vertical-align:middle}
tr:hover td{background:#fafcfe}
td img{width:52px;height:44px;object-fit:cover;border-radius:8px;display:block}
td small{display:block;color:var(--gray)}
.acts{display:flex;gap:6px}
.badge{display:inline-block;padding:3px 10px;border-radius:12px;font-size:.72rem;font-weight:700;white-space:nowrap}
.b-g{background:var(--gbg);color:var(--green)}.b-o{background:var(--ybg);color:var(--ot)}
.empty{text-align:center;padding:44px 20px;color:var(--gray)}.empty span{font-size:2.6rem;display:block;opacity:.5}
/* modal + forms */
.mbg{position:fixed;inset:0;background:#12233f80;backdrop-filter:blur(3px);z-index:60;display:grid;place-items:center;padding:16px}
.modal{background:#fff;border-radius:16px;width:100%;max-width:700px;max-height:92vh;overflow-y:auto}
.modal.sm{max-width:380px;padding:30px;text-align:center}
.mh{display:flex;justify-content:space-between;align-items:center;padding:20px 26px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:2}
.mh h2{font-size:1.35rem}.mh button{background:none;border:0;font-size:1.6rem;color:var(--gray)}
.mb{padding:22px 26px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px}
.full{grid-column:1/-1}
.fg label,.fl{display:block;font-size:.72rem;font-weight:700;color:var(--gray);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.fg input,.fg select,.fg textarea,.am input{width:100%;border:1.5px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--light);outline:none}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--orange);background:#fff}
.fg textarea{min-height:90px;resize:vertical}
.fg small{display:block;color:var(--gray);font-size:.75rem;margin-top:4px}
.sec{grid-column:1/-1;font:700 1rem Outfit;padding-top:8px;border-top:1px solid var(--line)}
.thumbs{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.th{position:relative;width:96px;height:76px}
.th img{width:100%;height:100%;object-fit:cover;border-radius:8px;border:2px solid var(--line)}
.th button{position:absolute;top:-7px;right:-7px;width:22px;height:22px;border-radius:50%;border:0;background:var(--red);color:#fff;font-size:.8rem;line-height:1}
.th span{position:absolute;left:4px;bottom:4px;background:var(--orange);color:#fff;font-size:.6rem;font-weight:700;padding:1px 6px;border-radius:6px}
.noimg{color:var(--gray);font-size:.82rem;padding:14px;border:2px dashed var(--line);border-radius:8px;flex:1;text-align:center}
.am{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.am input{flex:1;min-width:180px}
.err{color:var(--red);font-size:.85rem;min-height:1.2em;grid-column:1/-1}
.mf{display:flex;gap:10px;justify-content:flex-end;grid-column:1/-1}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:20px}
#toast{position:fixed;bottom:24px;right:24px;background:var(--green);color:#fff;padding:12px 20px;border-radius:8px;box-shadow:0 8px 24px #0003;z-index:99;max-width:320px;transform:translateY(90px);opacity:0;transition:.3s}
#toast.show{transform:none;opacity:1}#toast.bad{background:var(--red)}
@media(max-width:900px){.stats{grid-template-columns:1fr 1fr}.steps,.cols{grid-template-columns:1fr}}
@media(max-width:700px){.sidebar{transform:translateX(-100%)}.sidebar.open{transform:none}main{margin-left:0}.menu-btn{display:block}.top,.content{padding-left:16px;padding-right:16px}.grid{grid-template-columns:1fr}.hide-m{display:none}input.search{width:100%}}

/* ---- versión moderna ---- */
body{background:#eef2f7}
.eyebrow{font:700 .68rem Inter;letter-spacing:2px;color:var(--ot);margin-bottom:2px}
.lg{display:flex;align-items:center;gap:10px;justify-content:center}.lg b{font:700 1.7rem Outfit}.lg b span{color:var(--orange)}
.bi{width:34px;height:38px;color:currentColor;flex-shrink:0}.login-card .lg{color:var(--navy)}
#login{background:linear-gradient(#12233fd9,#12233fee),url(assets/hero.jpg) center/cover}
.login-card{border-radius:24px;box-shadow:0 40px 100px #0008}
.brand.lg{justify-content:flex-start;font:inherit;padding:22px 18px}.brand.lg b{font-size:1.45rem;display:block;line-height:1}.brand.lg small{margin:0 0 2px}
.brand .tag{margin:0 0 0 auto}
.sidebar{background:var(--navy);box-shadow:8px 0 40px #12233f22}
.nav{border:0;border-radius:12px;width:calc(100% - 20px);margin:2px 10px;padding:11px 14px;transition:.15s}
.nav.on{background:var(--orange);color:#fff;box-shadow:0 6px 18px #ff6a1f55}.nav.on em{background:#fff3}
.top{background:#ffffffcc;backdrop-filter:blur(12px);height:76px;border-bottom:1px solid #12233f10}
.top h2{font-size:1.6rem;flex:none;line-height:1.1}
.content{padding-top:24px}
.btn{border-radius:999px;padding:10px 20px;box-shadow:0 6px 16px #ff6a1f33;transition:.15s}.btn:hover{transform:translateY(-1px)}
.btn.ghost{box-shadow:none;border-radius:999px}.btn.danger{box-shadow:none}
.ib{border-radius:999px}
.hero{position:relative;border-radius:24px;overflow:hidden;color:#fff;padding:38px 36px;margin-bottom:22px;background:linear-gradient(100deg,#12233ff2 35%,#12233f99),url(assets/hero.jpg) center/cover}
.hero .eyebrow{color:var(--orange)}
.hero h1{font-size:clamp(1.8rem,4vw,2.7rem);line-height:1.05;margin:6px 0 10px}
.hero p{color:#ffffffcc;max-width:480px;margin-bottom:20px;line-height:1.5}
.hero .quick .btn.ghost{background:#ffffff1f;color:#fff;border:1px solid #fff4;backdrop-filter:blur(6px)}
.hero .quick .btn.ghost:hover{background:#fff;color:var(--navy)}
.stat{border:0;border-radius:18px;padding:20px;box-shadow:0 10px 30px #12233f0d;transition:.2s;cursor:pointer}
.stat:hover{transform:translateY(-3px);box-shadow:0 14px 34px #12233f1a}
.stat span{display:grid;place-items:center;width:44px;height:44px;border-radius:12px;background:#e8eef8;font-size:1.3rem}
.stat.o span{background:var(--ybg)}
.stat b{font-size:2.3rem;margin-top:12px}
div.stat{cursor:default}div.stat:hover{transform:none}
.box{border-radius:20px;box-shadow:0 10px 30px #12233f0d}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}.bar h3{flex:1;font-size:1.2rem}
.seg{display:flex;background:#fff;border-radius:999px;padding:3px;border:1.5px solid var(--line)}
.seg button{border:0;background:none;border-radius:999px;padding:5px 12px;font-size:.8rem;color:var(--gray)}.seg .on{background:var(--navy);color:#fff}
input.search{border-radius:999px;background:#fff;padding:9px 16px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.card{background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 10px 30px #12233f0d;transition:.2s;display:flex;flex-direction:column}
.card:hover{transform:translateY(-4px);box-shadow:0 16px 40px #12233f1c}
.ph{position:relative;aspect-ratio:16/10;overflow:hidden;background:var(--light)}
.ph img{width:100%;height:100%;object-fit:cover;transition:.4s}.card:hover .ph img{transform:scale(1.05)}
.ph .badge{position:absolute;top:12px;left:12px}
.cb{padding:16px 18px 18px;display:flex;flex-direction:column;gap:6px;flex:1}
.cb h4{font:600 1.1rem Outfit;line-height:1.25}.cb p{color:var(--gray);font-size:.84rem;flex:1}.cb small{display:block;color:var(--ot);font-weight:700;font-size:.95rem;margin-top:2px}
.cb .acts{margin-top:10px}.cb .acts .ib:first-child{flex:1}
.modal{border-radius:24px;animation:up .3s cubic-bezier(.2,.7,.2,1)}@keyframes up{from{opacity:0;transform:translateY(24px)}}
.mh h2{font-size:1.5rem}
.fg input,.fg select,.fg textarea{border-radius:12px}
.sec{color:var(--ot);font:700 .7rem Inter;letter-spacing:2px;text-transform:uppercase}
.th img{border-radius:12px}
#toast{border-radius:999px;padding:12px 22px}
@media(max-width:700px){.hero{padding:26px 22px}.top{height:68px}.top h2{font-size:1.3rem}}

/* ---- mensajes ---- */
.stats{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.msgs{display:grid;gap:14px}
.msg{background:#fff;border-radius:20px;box-shadow:0 10px 30px #12233f0d;padding:20px 22px}
.msg-h{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.msg-h>div:nth-child(2){flex:1;min-width:0}
.msg-h small{display:block;color:var(--gray);font-size:.78rem}
.msg-t{margin:14px 0;padding:14px 16px;background:var(--light);border-radius:12px;line-height:1.55;white-space:pre-wrap;font-size:.92rem}
.msg-m{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.msg-m a{display:inline-flex;align-items:center;gap:6px;font-size:.82rem;color:var(--blue);text-decoration:none;border:1.5px solid var(--line);border-radius:999px;padding:5px 12px}
.msg-m a:hover{border-color:var(--orange);color:var(--ot)}.msg-m .ic{width:14px;height:14px}
.msg-f{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:14px}
.chk{display:inline-flex;align-items:center;gap:10px;font-weight:500;cursor:pointer;user-select:none}
.chk input{width:20px;height:20px;accent-color:var(--orange);cursor:pointer}
.msg-f small{color:var(--gray)}
.b-p{background:var(--ybg);color:var(--ot)}
.nav em.hot{background:var(--orange);color:#fff}
/* ---- iconos ---- */
.ic{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;vertical-align:middle}
.nav i{display:grid;place-items:center}.nav i .ic{width:19px;height:19px}
.stat span .ic{width:22px;height:22px;color:var(--blue)}.stat.o span .ic{color:var(--ot)}
.empty .ic{width:42px;height:42px;display:block;margin:0 auto 10px;opacity:.45}
.ib{display:inline-flex;align-items:center;gap:6px}.ib .ic{width:15px;height:15px}
.seg button{display:inline-flex;align-items:center;gap:6px}.seg .ic{width:15px;height:15px}
.side-foot button,.menu-btn{display:grid;place-items:center;padding:6px}.side-foot .ic,.menu-btn .ic{width:20px;height:20px}
.btn .ic{width:16px;height:16px}
</style>
</head>
<body>
<div id="login">
  <div class="login-card">
    <div class="lg"><svg class="bi" viewBox="0 0 50 54" aria-hidden="true"><path d="M3 49V21L19 11v38M24 49V4l20 12v33M10 26v17M32 17v26" fill="none" stroke="currentColor" stroke-width="5"/><path d="M0 51h50M19 11V2" stroke="#FF6A1F" stroke-width="4"/></svg><b>En<span>Obra</span></b></div>
    <p class="eyebrow" style="margin-top:22px">ADMINISTRACIÓN</p><h1>¿Quién edita hoy?</h1><p>Elige tu perfil para entrar al panel.</p>
    <div id="profiles"></div>
    <div class="warn">Panel de demostración: elegir un perfil no es un acceso con contraseña. Los cambios se guardan solo en este navegador.</div>
  </div>
</div>

<div id="app" hidden>
  <aside class="sidebar" id="sidebar">
    <div class="brand lg"><svg class="bi" viewBox="0 0 50 54" aria-hidden="true"><path d="M3 49V21L19 11v38M24 49V4l20 12v33M10 26v17M32 17v26" fill="none" stroke="currentColor" stroke-width="5"/><path d="M0 51h50M19 11V2" stroke="#FF6A1F" stroke-width="4"/></svg><span><small>CONSTRUYE</small><b>En<span>Obra</span></b></span><span class="tag">ADMIN</span></div>
    <nav id="nav"></nav>
    <div class="side-foot">
      <div class="avatar" id="av"></div>
      <div><b id="uname"></b><small id="urole"></small></div>
      <button id="logout" title="Cambiar de perfil" aria-label="Cambiar de perfil"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4H5v16h4M16 8l4 4-4 4M20 12H9"/></svg></button>
    </div>
  </aside>
  <main>
    <div class="top">
      <button class="menu-btn" id="menu" aria-label="Abrir menú"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <div style="flex:1;min-width:0"><p class="eyebrow">ADMINISTRACIÓN</p><h2 id="title"></h2></div>
      <div id="top-act"></div>
    </div>
    <div class="content" id="content"></div>
  </main>
</div>
<div id="modal" class="mbg" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>

<script src="data.js"></script>
<script src="store.js"></script>
<script src="admin.js"></script>
</body>
</html>
